<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    
    <radialGradient id="obsidianBase" cx="50%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#19191F" />
      <stop offset="55%" stop-color="#0E0E12" />
      <stop offset="100%" stop-color="#060608" />
    </radialGradient>

    
    <radialGradient id="topAmbient" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.065" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="porcelainWhite" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="48%" stop-color="#F5F5F7" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>

    
    <linearGradient id="specularStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#71717A" stop-opacity="0.15" />
    </linearGradient>

    
    <linearGradient id="titaniumSlate" x1="0%" y1="0%" x2="100%" y2="100%">
