      <stop offset="100%" stop-color="#27272B" />
    </linearGradient>

    
    <filter id="flagshipDepth" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.72" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.52" />
    </filter>
  </defs>

  
  <rect width="512" height="512" fill="url(#obsidianBase)" />
  <rect width="512" height="512" fill="url(#topAmbient)" />

  
  <rect x="18" y="18" width="476" height="476" rx="118" fill="none" stroke="#1E1E24" stroke-width="1.5" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#27272F" stroke-width="1" opacity="0.6" />

  
  <g transform="translate(258, 256)" filter="url(#flagshipDepth)">
    
    
